services:
  - type: web
    name: glucodiary-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: COOKIE_SECURE
        value: 'true'
      - key: ALLOW_SIGNUP
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: REMINDER_RUNNER_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: 'GlucoDiary <onboarding@resend.dev>'
      - key: OPENAI_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
